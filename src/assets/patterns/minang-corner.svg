<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="cornerGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Central circle -->
  <circle cx="50" cy="50" r="8" fill="none" stroke="url(#cornerGold)" stroke-width="2"/>
  <circle cx="50" cy="50" r="4" fill="url(#cornerGold)"/>
  
  <!-- Radiating lines -->
  <g stroke="url(#cornerGold)" stroke-width="1.5" fill="none">
    <line x1="50" y1="50" x2="50" y2="15"/>
    <line x1="50" y1="50" x2="50" y2="85"/>
    <line x1="50" y1="50" x2="15" y2="50"/>
    <line x1="50" y1="50" x2="85" y2="50"/>
    <line x1="50" y1="50" x2="22" y2="22"/>
    <line x1="50" y1="50" x2="78" y2="22"/>
    <line x1="50" y1="50" x2="22" y2="78"/>
    <line x1="50" y1="50" x2="78" y2="78"/>
  </g>
  
  <!-- Decorative crosses at ends -->
  <g stroke="url(#cornerGold)" stroke-width="2">
    <line x1="50" y1="10" x2="50" y2="20"/>
    <line x1="45" y1="15" x2="55" y2="15"/>
    
    <line x1="50" y1="80" x2="50" y2="90"/>
    <line x1="45" y1="85" x2="55" y2="85"/>
    
    <line x1="10" y1="50" x2="20" y2="50"/>
    <line x1="15" y1="45" x2="15" y2="55"/>
    
    <line x1="80" y1="50" x2="90" y2="50"/>
    <line x1="85" y1="45" x2="85" y2="55"/>
  </g>
  
  <!-- Small decorative dots -->
  <g fill="url(#cornerGold)">
    <circle cx="35" cy="35" r="2"/>
    <circle cx="65" cy="35" r="2"/>
    <circle cx="35" cy="65" r="2"/>
    <circle cx="65" cy="65" r="2"/>
  </g>
</svg>
