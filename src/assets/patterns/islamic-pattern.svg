<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="islamicGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#d4af37;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b4513;stop-opacity:1" />
    </linearGradient>
    <pattern id="islamicPattern" patternUnits="userSpaceOnUse" width="20" height="20">
      <path d="M10,0 L10,20 M0,10 L20,10" stroke="#8b4513" stroke-width="0.5" opacity="0.3"/>
      <circle cx="10" cy="10" r="2" fill="#d4af37" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Eight-pointed star (Star of the Prophet) -->
  <g fill="none" stroke="url(#islamicGold)" stroke-width="2">
    <!-- Overlapping squares -->
    <polygon points="50,10 61,35 87,35 69,50 87,65 61,65 50,90 39,65 13,65 31,50 13,35 39,35" 
             stroke-width="1.5" opacity="0.6"/>
    
    <!-- Central octagon -->
    <polygon points="50,35 61,39 65,50 61,61 50,65 39,61 35,50 39,39" 
             fill="url(#islamicGold)" fill-opacity="0.1"/>
    
    <!-- Decorative circles -->
    <circle cx="50" cy="50" r="5" fill="none" stroke-width="2"/>
    <circle cx="50" cy="50" r="2" fill="url(#islamicGold)"/>
  </g>
  
  <!-- Corner decorations inspired by mosque geometry -->
  <g stroke="url(#islamicGold)" stroke-width="1" fill="none" opacity="0.5">
    <path d="M10,10 L10,25 M10,10 L25,10"/>
    <path d="M90,10 L90,25 M90,10 L75,10"/>
    <path d="M10,90 L10,75 M10,90 L25,90"/>
    <path d="M90,90 L90,75 M90,90 L75,90"/>
  </g>
  
  <!-- Background pattern -->
  <rect width="100" height="100" fill="url(#islamicPattern)" opacity="0.3"/>
</svg>
