<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="brideGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4be;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#brideGradient)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Decorative border pattern -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#8b4513" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  
  <!-- Silhouette placeholder for bride -->
  <g opacity="0.6">
    <!-- Head -->
    <circle cx="100" cy="75" r="25" fill="none" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Simple dress shape -->
    <path d="M60,100 Q60,170 100,170 Q140,170 140,100" fill="none" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Hair decoration hint -->
    <circle cx="100" cy="50" r="8" fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
  
  <!-- text -->
  <text x="100" y="210" text-anchor="middle" font-family="serif" font-size="24" fill="#8b4513">Zizi</text>
</svg>
