<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <linearGradient id="groomGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5e6d3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e8d4be;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background circle -->
  <circle cx="100" cy="100" r="98" fill="url(#groomGradient)" stroke="#d4af37" stroke-width="2"/>
  
  <!-- Decorative border pattern -->
  <circle cx="100" cy="100" r="90" fill="none" stroke="#8b4513" stroke-width="1" stroke-dasharray="5,5" opacity="0.3"/>
  
  <!-- Silhouette placeholder for groom with songkok/peci -->
  <g opacity="0.6">
    <!-- Head -->
    <circle cx="100" cy="70" r="22" fill="none" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Songkok (traditional cap) -->
    <ellipse cx="100" cy="48" rx="20" ry="8" fill="none" stroke="#8b4513" stroke-width="2"/>
    
    <!-- Simple kurta/shirt shape -->
    <path d="M60,95 Q60,160 100,160 Q140,160 140,95" fill="none" stroke="#8b4513" stroke-width="2"/>
  </g>
  
  <!-- text -->
  <text x="100" y="210" text-anchor="middle" font-family="serif" font-size="24" fill="#8b4513">Ulwan</text>
</svg>
